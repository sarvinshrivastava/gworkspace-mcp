name: Deploy to VPS

# workflow_dispatch ONLY, by a human. Same shape as openwebui-vsp and pages-mcp: the VPS is
# never touched outside this workflow.
#
# SECRETS_MANAGER_READ_TOKEN is the only repo secret; VPS_HOST, VPS_SSH_KEY and
# VPS_HOST_KEY come from the vault at run time.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (latest, or sha-<short> to pin/roll back)'
        required: true
        default: 'latest'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REMOTE_DIR: /opt/gworkspace-mcp
  VAULT_URL: https://secrets.vps.sarvinshrivastava.space
  VAULT_FOLDER: Root

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The tag reaches a root shell on the VPS, and GitHub substitutes it into
      # the script text before bash parses it — so constrain its shape first.
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^(latest|sha-[0-9a-f]{7,40})$ ]] \
            || { echo "::error::image_tag must be 'latest' or 'sha-<short>', got '$IMAGE_TAG'"; exit 1; }

      - name: Fetch VPS credentials from the vault
        env:
          # Accepts either spelling, because the repos on this account are not
          # consistent yet and a deploy that fails on a name is a bad first
          # experience. The error below names both. Worth normalising
          # to one name eventually; until then a mismatch fails the deploy at its
          # first step with a message that does not mention naming.
          VAULT_TOKEN: ${{ secrets.SECRETS_MANAGER_READ_TOKEN || secrets.SECRET_MANAGER_READ_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${VAULT_TOKEN}" ] || { echo "::error::neither SECRETS_MANAGER_READ_TOKEN nor SECRET_MANAGER_READ_TOKEN is set"; exit 1; }

          # The same vault-read used across these services, kept byte-identical with
          # openwebui-vsp. It handles the two failure modes that bit us there:
          # a retried response body gluing itself in front of the good one, and
          # an empty value passing every guard.
          export VAULT_URL="${{ env.VAULT_URL }}"
          export VAULT_FOLDER="${{ env.VAULT_FOLDER }}"
          export VAULT_TOKEN
          export VAULT_ERR_PREFIX="::error::"
          source ./vault-fetch.sh

          VPS_HOST="$(vault_fetch VPS_HOST)"
          echo "::add-mask::${VPS_HOST}"
          echo "VPS_HOST=${VPS_HOST}" >> "$GITHUB_ENV"

          # ::add-mask:: is line-oriented: masking a multi-line PEM in one call
          # leaks every line after the first into the job log.
          VPS_SSH_KEY="$(vault_fetch VPS_SSH_KEY)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$VPS_SSH_KEY"

          install -m 700 -d ~/.ssh
          ( umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 )

          # vault_fetch returns 1 for a definite refusal (key absent) and 2 for a
          # transient failure. Collapsing them would mean a vault blip silently
          # downgrades host verification to trust-on-first-use — and the script
          # then hands both bearer tokens to whatever answers on port 22.
          set +e
          VPS_HOST_KEY="$(vault_fetch VPS_HOST_KEY)"
          host_key_rc=$?
          set -e

          if [ $host_key_rc -eq 0 ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            echo "host key pinned from vault"
          elif [ $host_key_rc -eq 2 ]; then
            echo "::error::vault was unreachable while fetching VPS_HOST_KEY — refusing to fall back to trust-on-first-use"
            exit 1
          else
            echo "::warning::VPS_HOST_KEY not in vault — falling back to trust-on-first-use. Add it to close this."
            ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          fi

      # The service reads these four at boot and exits if any is missing or
      # malformed. Without this step that shows up as a crash-looping container
      # 90 seconds into the deploy, and you read it out of `docker logs`. The
      # runner already holds a vault read token, so it can just ask first.
      - name: Verify the service's own secrets exist before touching the VPS
        env:
          VAULT_TOKEN: ${{ secrets.SECRETS_MANAGER_READ_TOKEN || secrets.SECRET_MANAGER_READ_TOKEN }}
        run: |
          set -euo pipefail
          export VAULT_URL VAULT_FOLDER VAULT_TOKEN
          export VAULT_ERR_PREFIX="::error::"
          source ./vault-fetch.sh

          missing=""
          for key in GWORKSPACE_MCP_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_TOKEN_JSON; do
            set +e
            value="$(vault_fetch "$key" 2>/dev/null)"
            rc=$?
            set -e
            if [ $rc -eq 2 ]; then
              echo "::error::vault unreachable while checking ${key} — not deploying against an unknown state"
              exit 1
            fi
            if [ $rc -ne 0 ] || [ -z "$value" ]; then
              missing="${missing} ${key}"
              continue
            fi
            # Shape only, never content. GOOGLE_TOKEN_JSON is the one that keeps
            # arriving with a stray character from a terminal copy, so check the
            # thing that actually breaks rather than merely that it is present.
            if [ "$key" = "GOOGLE_TOKEN_JSON" ]; then
              printf '%s' "$value" | python3 -c "
          import json, sys
          raw = sys.stdin.read().strip()
          if raw.startswith('1//'):
              sys.exit(0)
          try:
              parsed = json.loads(raw)
          except Exception as error:
              print(f'::error::GOOGLE_TOKEN_JSON is not valid JSON ({error}). '
                    f'It is {len(raw)} characters over {len(raw.splitlines())} line(s), '
                    f'starts with {raw[:2]!r} and ends with {raw[-2:]!r}. '
                    f'A trailing % is zsh marking output with no newline - it is not part of the token.')
              sys.exit(1)
          if not parsed.get('refresh_token'):
              print(f'::error::GOOGLE_TOKEN_JSON has no refresh_token. Keys found: '
                    f'{\", \".join(parsed) or \"(none)\"}. client_id/client_secret there means '
                    f'the OAuth CLIENT file was stored instead of the token.')
              sys.exit(1)
          " || exit 1
            fi
            echo "${key}: present"
          done

          if [ -n "$missing" ]; then
            echo "::error::missing from vault folder ${VAULT_FOLDER}:${missing}"
            echo "Add them and re-run. Nothing on the VPS was touched."
            exit 1
          fi
          echo "all four service secrets are present and usable"

          # The dashboard password hash is optional at runtime (login is just
          # disabled without it), so absence is a warning. A malformed one is an
          # error: the service would read it and refuse every login.
          set +e
          hash="$(vault_fetch DASHBOARD_ADMIN_PASSWORD_HASH 2>/dev/null)"
          rc=$?
          set -e
          if [ $rc -eq 2 ]; then
            echo "::error::vault unreachable while checking DASHBOARD_ADMIN_PASSWORD_HASH — not deploying against an unknown state"
            exit 1
          elif [ $rc -ne 0 ] || [ -z "$hash" ]; then
            echo "::warning::DASHBOARD_ADMIN_PASSWORD_HASH is not in vault folder ${VAULT_FOLDER} — the admin dashboard will refuse every login. Make one with \`cd go-port && go run ./cmd/hash-password\` (it prompts for the password)."
          elif ! [[ "$hash" =~ ^scrypt\$[0-9]+\$[0-9]+\$[0-9]+\$[A-Za-z0-9+/=]+\$[A-Za-z0-9+/=]+$ ]]; then
            echo "::error::DASHBOARD_ADMIN_PASSWORD_HASH is not a scrypt\$N\$r\$p\$salt\$key hash (${#hash} characters). Store the exact output of go-port's cmd/hash-password."
            exit 1
          else
            echo "DASHBOARD_ADMIN_PASSWORD_HASH: present"
          fi

      - name: Verify the tag exists before touching the VPS
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" > /dev/null

      - name: Ship compose file
        run: |
          set -euo pipefail
          ssh -T -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "root@${VPS_HOST}" "mkdir -p ${{ env.REMOTE_DIR }}"
          scp -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 docker-compose.yml \
            "root@${VPS_HOST}:${{ env.REMOTE_DIR }}/docker-compose.yml"

      - name: Pull and restart
        env:
          # Sent on STDIN, ahead of the script, each value quoted with printf %q.
          #
          # The obvious form — `ssh host A="$A" bash -s` — does NOT keep them out
          # of the shell: ssh joins every argument into one string that the REMOTE
          # login shell parses, so a secret containing a quote or $( ) executes as
          # root, which is exactly the class the image_tag validation above exists
          # to prevent. It also puts the values in the remote argv, where ps can
          # read them for the life of the deploy.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SM_TOKEN: ${{ secrets.SECRETS_MANAGER_READ_TOKEN || secrets.SECRET_MANAGER_READ_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        run: |
          set -euo pipefail
          {
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'SM_TOKEN=%q\n'   "$SM_TOKEN"
            printf 'IMAGE_REF=%q\n'  "$IMAGE_REF"
            printf 'REGISTRY=%q\n'   "$REGISTRY"
            printf 'ACTOR=%q\n'      "$ACTOR"
            printf 'REMOTE_DIR=%q\n' "$REMOTE_DIR"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$REMOTE_DIR"

          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin

          # Both networks are `external: true` in the compose file. `shared` is
          # ours to create; `secrets-manager_default` belongs to the vault project,
          # and if it is absent the vault is down — fail here rather than half way
          # through `up`, after the compose file has already been replaced.
          docker network inspect shared >/dev/null 2>&1 || docker network create shared
          docker network inspect secrets-manager_default >/dev/null 2>&1 \
            || { echo "secrets-manager_default is missing — is the vault up?"; exit 1; }

          touch .env
          sed -i '/^GWORKSPACE_IMAGE=/d' .env
          echo "GWORKSPACE_IMAGE=$IMAGE_REF" >> .env

          # `up` removes the running container BEFORE it binds the new one's
          # ports, so a host port someone else holds means an outage, not a
          # failed deploy. Check first, while the old container still serves.
          # Keep in step with `ports:` in docker-compose.yml.
          # 3014 = MCP (nginx vhost gworkspace-mcp.vps), 3017 = admin dashboard.
          for HOST_PORT in 3014 3017; do
            if ss -ltnH "sport = :${HOST_PORT}" | grep -q .; then
              holder=$(docker ps --filter "publish=${HOST_PORT}" --format '{{.Names}}')
              if [ "$holder" != "gworkspace-mcp" ]; then
                echo "host port ${HOST_PORT} is already held by: ${holder:-a non-Docker process}. Not touching the running container."
                exit 1
              fi
            fi
          done

          export SECRETS_MANAGER_TOKEN="$SM_TOKEN"
          docker compose -f docker-compose.yml pull
          # --force-recreate: every credential (vault token, Google token, the
          # dashboard hash) is read at BOOT. Without it, `up` sees the same image
          # and compose file, leaves the old container running, and a rotated
          # secret never takes effect — while this run still reports green.
          docker compose -f docker-compose.yml up -d --remove-orphans --force-recreate
          unset SECRETS_MANAGER_TOKEN
          docker logout "$REGISTRY" || true
          REMOTE_SCRIPT
          } | ssh -T -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "root@${VPS_HOST}" bash -s

      - name: Wait for health
        run: |
          set -euo pipefail
          ssh -T -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "root@${VPS_HOST}" bash -s <<'REMOTE_SCRIPT'
          # Baseline the restart count. It is cumulative for the life of the
          # container, and `up -d` leaves an unchanged container in place — so a
          # container still crash-looping from the PREVIOUS deploy trips the
          # detector on attempt 1 and this deploy gets blamed for it.
          base_restarts=$(docker inspect gworkspace-mcp --format "{{.RestartCount}}" 2>/dev/null || echo 0)
          for i in $(seq 1 30); do
            status=$(docker inspect gworkspace-mcp --format "{{.State.Health.Status}}" 2>/dev/null || echo missing)
            total=$(docker inspect gworkspace-mcp --format "{{.RestartCount}}" 2>/dev/null || echo 0)
            restarts=$(( total - base_restarts ))
            [ "$restarts" -lt 0 ] && restarts=0
            echo "attempt $i: health=$status restarts=$restarts"
            if [ "$status" = "healthy" ]; then
              # Read /healthz from the host, not by exec: the Go image has no
              # node or shell, and both images publish it on 127.0.0.1:3014.
              # Both emit compact JSON (Express res.json, Go json.Marshal) and
              # db, tools and probe are unique keys, so fixed strings match.
              healthz() { curl -sS --max-time 5 http://127.0.0.1:3014/healthz 2>/dev/null || true; }
              body=""
              for _ in $(seq 1 6); do
                body=$(healthz)
                [ -n "$body" ] && break
                sleep 5
              done
              if [ -z "$body" ]; then
                echo "::error::gworkspace-mcp reports healthy but 127.0.0.1:3014/healthz did not answer for 30s — is the port published?"
                exit 1
              fi
              # Healthy is not enough: without its volume the service boots in a
              # degraded mode that still answers 200 but refuses every minted
              # token. That is a failed deploy, not a green one.
              case "$body" in
                *'"db":true'*) ;;
                *)
                  echo "::error::gworkspace-mcp is up but its policy database is not (healthz db=false) — is the gworkspace-state volume mounted?"
                  docker logs --tail 50 gworkspace-mcp 2>&1 | grep -E "\[db\]|FATAL" || true
                  exit 1 ;;
              esac
              # An empty volume looks healthy too: the service creates a fresh
              # database and seeds the default agent, and every other agent,
              # token and grant is gone. --force-recreate makes this container's
              # log start at this deploy, restarts included.
              if docker logs gworkspace-mcp 2>&1 | grep -q "\[db\] created the default agent"; then
                echo "::error::this boot created a fresh policy database: every agent, token and grant from before is gone. Expected only on a brand-new volume; otherwise check the gworkspace-state volume."
                exit 1
              fi
              # Zero tools: TOOL_ALLOWLIST overridden on the VPS with names this
              # image does not serve. ("upstreamTools" never matches: capital T.)
              case "$body" in
                *'"tools":0'*)
                  echo "::error::gworkspace-mcp exposes 0 tools — is TOOL_ALLOWLIST overridden in /opt/gworkspace-mcp/.env?"
                  docker logs gworkspace-mcp 2>&1 | grep -E "^\[tools\]" | tail -3 || true
                  exit 1 ;;
              esac
              # Healthy says nothing about Google. An expired or revoked refresh
              # token boots fine and fails every call, so surface the boot
              # probe's verdict. The TS image answers 200 before its probe has
              # run ("probe":"unknown"), so poll.
              probe=""
              for _ in $(seq 1 12); do
                case "$body" in
                  *'"probe":"ok"'*) probe=ok; break ;;
                  *'"probe":"failed"'*) probe=failed; break ;;
                esac
                sleep 5
                body=$(healthz)
              done
              case "$probe" in
                ok) echo "Google credential verified" ;;
                failed) echo "::warning::the boot check of the Google credential failed ($(printf '%s' "$body" | grep -o '"state":"[a-z_]*"' | head -1)) — the service is up but every Workspace call will fail until GOOGLE_TOKEN_JSON is fixed" ;;
                *) echo "::warning::the Google credential check did not report within 60s — check docker logs" ;;
              esac
              exit 0
            fi
            if [ "$status" = "missing" ]; then docker logs --tail 50 gworkspace-mcp 2>&1 || true; exit 1; fi
            if [ "$restarts" -gt 2 ]; then echo "crash-looping"; docker logs --tail 100 gworkspace-mcp 2>&1 || true; exit 1; fi
            sleep 10
          done
          echo "never became healthy"; docker logs --tail 100 gworkspace-mcp 2>&1 || true; exit 1
          REMOTE_SCRIPT

      - name: Report
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "Tag: \`${{ inputs.image_tag }}\`"
            echo ""
            echo "Wire it in Open WebUI: Admin → Settings → Integrations → MCP → \`http://gworkspace-mcp:3014/mcp\`, auth Bearer."
            echo ""
            echo "Admin dashboard: \`ssh -N -L 3015:127.0.0.1:3017 root@<vps>\`, then open http://localhost:3015"
            if [ "${{ job.status }}" != "success" ]; then
              echo ""
              echo "Roll back to the last TS relay: run this workflow again with image_tag \`sha-e8d3d40\` (same compose file, same volume)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
