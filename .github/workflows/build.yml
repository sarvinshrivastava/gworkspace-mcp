name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'learnings/**'
      - 'docs/**'
      - '**/*.md'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is useless if it cannot start. This catches a missing runtime
      # dependency in the same minute rather than as a crash loop on the VPS.
      - name: Smoke test — the server boots and serves health
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # The dashboard password hash, made the way `npm run hash-password`
          # makes it (same scrypt parameters and format), for password ci-admin.
          ADMIN_HASH=$(python3 -c "
          import base64, hashlib, os
          salt = os.urandom(16)
          key = hashlib.scrypt(b'ci-admin', salt=salt, n=16384, r=8, p=1, dklen=32)
          print('scrypt\$16384\$8\$1\$' + base64.b64encode(salt).decode() + '\$' + base64.b64encode(key).decode())
          ")
          export ADMIN_HASH

          # A stub vault, answering per key. GOOGLE_TOKEN_JSON has to be a real
          # OAuth document: the relay refuses to hand the child anything without
          # a refresh_token, because the upstream silently falls back to the
          # INTERACTIVE consent flow on a bad one and then hangs forever.
          # Nothing here reaches Google — the upstream's authorize() makes no
          # network call, so the child boots and lists its tools on fake
          # credentials, and only a real tool CALL would need real ones.
          python3 -c "
          import json, os
          from http.server import BaseHTTPRequestHandler, HTTPServer
          VALUES = {
              'GWORKSPACE_MCP_TOKEN': 'ci-smoke',
              'GOOGLE_CLIENT_ID': 'ci-client-id.apps.googleusercontent.com',
              'GOOGLE_CLIENT_SECRET': 'ci-client-secret',
              'GOOGLE_TOKEN_JSON': json.dumps({
                  'type': 'authorized_user',
                  'client_id': 'ci-client-id.apps.googleusercontent.com',
                  'client_secret': 'ci-client-secret',
                  'refresh_token': 'ci-refresh-token',
              }),
              'DASHBOARD_ADMIN_PASSWORD_HASH': os.environ['ADMIN_HASH'],
          }
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  key = self.path.rsplit('/', 1)[-1]
                  if key not in VALUES:
                      self.send_response(404); self.end_headers(); return
                  b=json.dumps({'key':key,'value':VALUES[key],'folder':'Root'}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
          HTTPServer(('0.0.0.0',8890),H).serve_forever()
          " &
          sleep 1

          # The production sandbox, not a bare `docker run`: read-only rootfs,
          # a tmpfs for the token store, a FRESH named volume for the policy DB
          # (proves the image's /state ownership carries over), dropped
          # capabilities and the real memory ceiling. Without these flags a
          # regression in any of them ships green and only fails on the VPS.
          #
          # appendTableRows is in the allowlist on purpose. The upstream's source
          # registers it twice (docs and sheets) and registerTool throws on a
          # duplicate name. It is no longer in any grant's tool map, so it cannot
          # reach registerTool at all: three names in, two tools out.
          # --network host: requests to the admin port come from 127.0.0.1,
          # which the image deliberately does not trust; allow it for CI only.
          run_smoke() {
            local name="$1"; shift
            docker run -d --name "$name" --network host \
              --read-only --tmpfs /tmp \
              --tmpfs /data:uid=1000,gid=1000,mode=0700,size=8m \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --memory 512m --memory-swap 640m \
              -e SECRETS_MANAGER_URL=http://127.0.0.1:8890 \
              -e SECRETS_MANAGER_TOKEN=ci \
              -e PORT=3014 -e ADMIN_PORT=3015 \
              -e ADMIN_ALLOWED_SOURCES=127.0.0.1 \
              "$@" "$IMAGE" > /dev/null
          }
          wait_healthy() {
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3014/healthz > /dev/null; then return 0; fi
              sleep 2
            done
            echo "never came up"; docker logs "$1"; exit 1
          }
          tool_count() {
            curl -s -X POST http://127.0.0.1:3014/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'Authorization: Bearer ci-smoke' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
              | sed -n 's/^data: //p' | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print(len(r['result']['tools']) if 'result' in r else 0)"
          }
          health_field() {
            curl -s http://127.0.0.1:3014/healthz | python3 -c "import sys,json; print(json.load(sys.stdin)['$1'])"
          }

          docker volume create smoke-state > /dev/null
          run_smoke smoke -v smoke-state:/state -e TOOL_ALLOWLIST=readDocument,appendText,appendTableRows
          wait_healthy smoke
          [ "$(health_field db)" = "True" ] || { echo "expected db:true"; docker logs smoke; exit 1; }
          echo "health ok, policy db open"

          # An unauthenticated call must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3014/mcp \
            -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "expected 401 without a bearer, got $code"; docker logs smoke; exit 1; }
          echo "auth gate ok"

          tools=$(tool_count)
          [ "$tools" = "2" ] || { echo "expected 2 tools, got $tools"; docker logs smoke; exit 1; }
          echo "legacy bearer → default agent → 2 tools ok"

          # The dashboard: login, CSRF, and a grant edit that must survive a
          # restart (proves the default agent is seeded once, never re-seeded).
          JAR=$(mktemp)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3015/login)
          [ "$code" = "200" ] || { echo "admin login page: $code"; docker logs smoke; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$JAR" -d 'password=ci-admin' http://127.0.0.1:3015/login)
          [ "$code" = "303" ] || { echo "admin login: expected 303, got $code"; docker logs smoke; exit 1; }
          grep -q gws_admin_sid "$JAR" || { echo "no session cookie"; exit 1; }
          CSRF=$(curl -s -b "$JAR" http://127.0.0.1:3015/agents/default | sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' | head -1)
          [ -n "$CSRF" ] || { echo "no csrf token on the agent page"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" -d 'g=docs:read' http://127.0.0.1:3015/agents/default/grants)
          [ "$code" = "403" ] || { echo "POST without csrf: expected 403, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$JAR" --data-urlencode "_csrf=$CSRF" -d 'g=docs:read' http://127.0.0.1:3015/agents/default/grants)
          [ "$code" = "303" ] || { echo "grant edit: expected 303, got $code"; exit 1; }
          echo "dashboard login, csrf and grant edit ok"

          docker restart smoke > /dev/null
          wait_healthy smoke
          tools=$(tool_count)
          [ "$tools" = "1" ] || { echo "expected 1 tool after the edit survived a restart, got $tools"; docker logs smoke; exit 1; }
          echo "grant edit survived a restart (no re-seed) ok"

          MEM=$(docker stats --no-stream --format '{{.MemUsage}}' smoke)
          echo "IDLE_MEM=$MEM" >> "$GITHUB_ENV"
          docker rm -f smoke > /dev/null

          # An empty allowlist must expose NOTHING. The unfiltered upstream
          # surface includes sendEmail, deleteFile and setFilePermission.
          docker volume create smoke-deny-state > /dev/null
          run_smoke smoke-deny -v smoke-deny-state:/state
          wait_healthy smoke-deny
          curl -s -X POST http://127.0.0.1:3014/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer ci-smoke' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | sed -n 's/^data: //p' > /tmp/deny.json
          # Two acceptable answers, and both mean zero tools. With nothing
          # registered McpServer never declares the tools capability, so
          # tools/list is legitimately "Method not found" (-32601) rather than an
          # empty list. Anything else means something got exposed.
          python3 -c "
          import json
          r = json.load(open('/tmp/deny.json'))
          if 'error' in r:
              assert r['error']['code'] == -32601, r
          else:
              assert r['result']['tools'] == [], r
          print('deny-by-default ok')
          "
          docker rm -f smoke-deny > /dev/null

          # No volume on a read-only rootfs: the DB cannot be created, so the
          # service must come up degraded — legacy bearer served, db:false.
          run_smoke smoke-degraded -e TOOL_ALLOWLIST=readDocument,appendText,appendTableRows
          wait_healthy smoke-degraded
          [ "$(health_field db)" = "False" ] || { echo "expected db:false"; docker logs smoke-degraded; exit 1; }
          tools=$(tool_count)
          [ "$tools" = "2" ] || { echo "degraded: expected 2 tools, got $tools"; docker logs smoke-degraded; exit 1; }
          echo "degraded mode ok"
          docker rm -f smoke-degraded > /dev/null

      - name: Report
        run: |
          set -euo pipefail
          SIZE=$(docker image inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" --format '{{.Size}}')
          {
            echo "### gworkspace-mcp built"
            echo ""
            echo "Uncompressed size: **$(( SIZE / 1024 / 1024 )) MB**"
            echo ""
            echo "Idle memory after boot (not under load): **${IDLE_MEM:-unknown}** of 512 MiB"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
