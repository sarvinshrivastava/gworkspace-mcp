name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'learnings/**'
      - 'docs/**'
      - '**/*.md'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is useless if it cannot start. This catches a missing runtime
      # dependency in the same minute rather than as a crash loop on the VPS.
      - name: Smoke test — the server boots and serves health
        run: |
          set -euo pipefail
          # A stub vault. Note this service ALSO starts a Google MCP child that
          # will fail to authenticate against stub credentials, so the smoke test
          # asserts the image boots and the auth gate works — not that Workspace
          # is reachable, which needs real credentials and belongs post-deploy.
          python3 -c "
          import json, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  b=json.dumps({'key':'GWORKSPACE_MCP_TOKEN','value':'ci-smoke','folder':'Root'}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
          HTTPServer(('0.0.0.0',8890),H).serve_forever()
          " &
          sleep 1

          docker run -d --name smoke --network host \
            -e SECRETS_MANAGER_URL=http://127.0.0.1:8890 \
            -e SECRETS_MANAGER_TOKEN=ci \
            -e PORT=3014 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3014/healthz > /dev/null; then echo "health ok"; break; fi
            if [ "$i" = "20" ]; then echo "never came up"; docker logs smoke; exit 1; fi
            sleep 2
          done

          # An unauthenticated call must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3014/mcp \
            -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "expected 401 without a bearer, got $code"; exit 1; }
          echo "auth gate ok"

          # And the tool list must actually be there.
          # tools/list is skipped here: the upstream child cannot connect with
          # stub credentials, so there are legitimately zero tools to list.
          tools=$(curl -s -X POST http://127.0.0.1:3014/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer ci-smoke' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | sed -n 's/^data: //p' | python3 -c "import sys,json; print(len(json.load(sys.stdin)['result']['tools']))")
          echo "tools/list returned $tools tools (0 is expected against a stub vault)"

          docker rm -f smoke > /dev/null

      - name: Report
        run: |
          set -euo pipefail
          SIZE=$(docker image inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" --format '{{.Size}}')
          {
            echo "### gworkspace-mcp built"
            echo ""
            echo "Uncompressed size: **$(( SIZE / 1024 / 1024 )) MB**"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
