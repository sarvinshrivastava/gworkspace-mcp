# gworkspace-mcp - Google Docs, Sheets, Drive and Calendar in chat.
#
# The image is the Go service built from go-port/ (one static binary, the tool
# handlers in-process). This file also boots the previous TS relay image
# (sha-e8d3d40), so a rollback is only a different image tag: keep it
# image-agnostic until the TS is removed.
#
#   SECRETS_MANAGER_TOKEN=<token> docker compose up -d

name: gworkspace-mcp

services:
  gworkspace-mcp:
    image: ${GWORKSPACE_IMAGE:-ghcr.io/sarvinshrivastava/gworkspace-mcp:latest}
    container_name: gworkspace-mcp
    restart: unless-stopped

    # MCP (:3014) is published on the host's loopback only, as 127.0.0.1:3014
    # (2026-10-10): nginx vhost gworkspace-mcp.vps terminates TLS for
    # https://gworkspace-mcp.vps.sarvinshrivastava.space and proxies it. Never
    # publish it on 0.0.0.0 — Docker bindings bypass UFW and are
    # internet-reachable; nginx is the only public entry (reel-drop pattern).
    # The admin dashboard (:3015 in the container) is published
    # on the host's loopback only, as :3017 — host :3015 belongs to reel-drop —
    # for an SSH tunnel:
    #   ssh -N -L 3015:127.0.0.1:3017 root@<vps>   then   http://localhost:3015
    # Other containers on `shared` can still reach :3015 by name; the app refuses
    # any source address that is not a bridge gateway (where host traffic
    # arrives). Not even loopback: inside the container that is the upstream
    # child. ADMIN_ALLOWED_SOURCES adds exact addresses if ever needed.
    expose:
      - '3014'
    ports:
      - '127.0.0.1:3014:3014'
      - '127.0.0.1:3017:3015'

    environment:
      PORT: '3014'
      ADMIN_PORT: '3015'
      DB_PATH: '/state/gworkspace-v2.sqlite'
      BACKUP_DIR: '/state/backups'
      # Who runs the daily audit prune + DB backup after the boot run:
      # `internal` (a 24 h interval in-process) or `external` (pipeline-runner's
      # job gworkspace-mcp/housekeeping calls POST /internal/housekeeping with
      # the vault's GWORKSPACE_PLR_TOKEN). Anything else refuses to boot.
      HOUSEKEEPING_SCHEDULER: '${HOUSEKEEPING_SCHEDULER:-external}'
      # TS image only (rollback); the Go service ignores these four.
      # CHILD_HEAP_MB is the TS upstream child's own budget, set explicitly
      # rather than inherited — two 192 MB heaps in one cgroup is how the
      # OOM-killer takes the child and leaves a healthy-looking container whose
      # every tool call fails.
      CONFIG_HOME: '/data/config'
      TOKEN_DIR: '/data/config/google-docs-mcp'
      NODE_OPTIONS: '--max-old-space-size=128'
      CHILD_HEAP_MB: '192'

      SECRETS_MANAGER_URL: '${SECRETS_MANAGER_URL:-http://secret-manager:8000}'
      SECRETS_MANAGER_FOLDER: '${SECRETS_MANAGER_FOLDER:-Root}'
      SECRETS_MANAGER_TOKEN: '${SECRETS_MANAGER_TOKEN:?set SECRETS_MANAGER_TOKEN in the shell, or deploy via the workflow}'

      NTFY_BASE: '${NTFY_BASE:-https://ntfy.sh}'

      # Measured: these 20 tools are 23 KB of schema, ~6k tokens; all 119 are
      # 126 KB, ~31k tokens — and Open WebUI re-lists on EVERY chat turn and
      # resends on every LLM call, so a 3-step tool sequence pays it four times.
      # Empty exposes NOTHING, deliberately: the unfiltered surface includes
      # sendEmail, deleteFile and setFilePermission on a full-Drive grant.
      TOOL_ALLOWLIST: '${TOOL_ALLOWLIST:-readDocument,appendText,insertText,findAndReplace,createDocument,listDocuments,searchDocuments,appendMarkdown,readSpreadsheet,writeSpreadsheet,appendRows,createSpreadsheet,listSpreadsheets,searchDriveFiles,listDriveFiles,createFolder,listEvents,createEvent,updateEvent,quickAddEvent}'

    # TS image only (rollback): its upstream child reads the refresh token from
    # a file here. The Go service keeps the token in memory and writes nothing
    # to /data. A tmpfs, not a volume: a volume only kept a second permanent
    # plaintext copy of a full-Drive + gmail.modify credential on host disk,
    # surviving `docker compose down`.
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700,size=8m
      - /tmp:size=16m

    # The policy database: agents, grants, folder scopes, token HASHES and the
    # audit log. No plaintext secret lives here. Backups land in
    # /state/backups/policy-<weekday>.sqlite (UTC, seven kept, same volume —
    # they cover corruption and bad edits, not losing the volume).
    #
    # Restore, exactly in this order (a stale -wal replayed over a restored file
    # corrupts it):
    #   docker compose stop gworkspace-mcp
    #   V=$(docker volume inspect -f '{{.Mountpoint}}' gworkspace-mcp_gworkspace-state)
    #   rm -f "$V/gworkspace-v2.sqlite-wal" "$V/gworkspace-v2.sqlite-shm"
    #   cp "$V/backups/policy-N.sqlite" "$V/gworkspace-v2.sqlite"
    #   chown 1000:1000 "$V/gworkspace-v2.sqlite"
    #   docker compose start gworkspace-mcp
    # A full reset deletes gworkspace-v2.sqlite AND its -wal/-shm, or the deleted
    # data comes back. If this volume is missing the service still boots, in a
    # degraded mode (/healthz "db": false) that only serves the legacy bearer.
    volumes:
      - gworkspace-state:/state

    networks:
      - shared # open-webui reaches /mcp by name
      - vault # secret-manager, for credentials at boot

    # Sized for the TS image (rollback): two Node processes, and an upstream
    # result held at once in the child's heap, the parent's read buffer and
    # the response. The Go service idles at ~15 MiB; tighten once the TS is gone.
    mem_limit: 512m
    memswap_limit: 640m # NOT equal to mem_limit: that disables swap entirely
    cpus: 0.25
    pids_limit: 256

    # An init forwards SIGTERM and reaps children: Node as PID 1 installs no
    # SIGTERM handler, and the Go binary closes the policy DB (checkpointing
    # the WAL) on the signal it forwards.
    init: true

    labels:
      autoheal: 'true'
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    # Nothing writes outside /data and /tmp (tmpfs) and /state (the volume).
    read_only: true

    # No `healthcheck:` here on purpose: each image carries its own HEALTHCHECK
    # with identical timings (60s interval, 10s timeout, 90s start period, 3
    # retries, both on :3014/healthz) — the Go binary checks itself with
    # `-healthcheck` (scratch has no shell, curl or node), the TS image uses
    # node. An override here would pin one image's command and break the other.

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  gworkspace-state: {}

networks:
  shared:
    external: true
  vault:
    external: true
    name: secrets-manager_default
